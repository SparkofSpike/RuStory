[workspace]
resolver = "3"
members = [
    "crates/rustory-core",
    "crates/rustory-script",
    "crates/rustory-render",
    "apps/rustory",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/SparkofSpike/rustory"
description = "RuStory — Rust-native visual novel engine with composable gameplay"

[workspace.dependencies]
rustory-core = { path = "crates/rustory-core" }
rustory-script = { path = "crates/rustory-script" }
rustory-render = { path = "crates/rustory-render" }

serde = { version = "1", features = ["derive"] }
ron = "0.11"
thiserror = "2"
unicode-segmentation = "1"

# Platform layer: borrow existing implementations of OS abstractions, never build
# them. The engine's own world model, scheduling, state machine, story format and
# gameplay contract all live in rustory-core and are written from scratch.
winit = "0.30"
wgpu = "30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
# Workspace crates stay at low optimization for fast incremental builds.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (especially wgpu/naga) run at high optimization; a low-optimized
# build is slow enough that a frame-rate problem looks like a renderer bug.
opt-level = 3
