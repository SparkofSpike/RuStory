[workspace]
resolver = "3"
members = [
    "crates/rustory-vn-core",
    "crates/rustory-vn-script",
    "crates/rustory-vn-render",
    "crates/rustory-vn-gameplay-timer",
    "crates/rustory-vn-gameplay-quiz",
    "crates/rustory-vn-edit",
    "crates/rustory-vn-audio",
    "apps/rustory-vn",
    "apps/rustory-vn-editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
repository = "https://github.com/SparkofSpike/RuStory"
homepage = "https://github.com/SparkofSpike/RuStory"
description = "RuStory — Rust-native visual novel engine with composable gameplay"

[workspace.dependencies]
rustory-vn-core = { path = "crates/rustory-vn-core" }
rustory-vn-script = { path = "crates/rustory-vn-script" }
rustory-vn-render = { path = "crates/rustory-vn-render" }
rustory-vn-gameplay-timer = { path = "crates/rustory-vn-gameplay-timer" }
rustory-vn-gameplay-quiz = { path = "crates/rustory-vn-gameplay-quiz" }
rustory-vn-edit = { path = "crates/rustory-vn-edit" }
rustory-vn-audio = { path = "crates/rustory-vn-audio" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
ron = "0.11"
thiserror = "2"
unicode-segmentation = "1"

# Platform layer: borrow existing implementations of OS abstractions, never build
# them. The engine's own world model, scheduling, state machine, story format and
# gameplay contract all live in rustory-vn-core and are written from scratch.
winit = "0.30"
wgpu = "30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# GUI: egui on top of the same wgpu version the renderer uses, so the editor can
# show engine output in a texture instead of reimplementing drawing.
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
# Workspace crates stay at low optimization for fast incremental builds.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (especially wgpu/naga) run at high optimization; a low-optimized
# build is slow enough that a frame-rate problem looks like a renderer bug.
opt-level = 3
