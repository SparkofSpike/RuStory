name: CI

# What this workflow is for
#
# README claims a test count, and a claim nobody checks decays. These gates run on every
# push: the code is formatted, clippy has nothing to say, the tests pass, and every command
# the README tells a reader to try actually runs.
#
# Nothing here builds a release artifact — this is a correctness gate, not a packaging
# pipeline.
#
# Linux rather than Windows because the runner costs nothing and starts faster. The GPU
# tests skip themselves when no adapter is present, and Ubuntu's software Vulkan usually
# means they run instead; either way the logic is exercised.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning nobody fails on is a warning nobody reads. Keep this on so clippy's advice
  # cannot rot into background noise.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting is checked, never applied: CI that rewrites the tree leaves a developer
      # unsure whether the change on disk is theirs.
      - run: cargo fmt --all -- --check

  clippy-and-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # winit needs xkbcommon and wayland headers, cpal needs ALSA, and the renderer needs a
      # Vulkan driver at run time. lavapipe is the software one, so a machine with no GPU still
      # draws — which is what makes the frame checks below meaningful on a runner.
      - name: Install system headers and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libasound2-dev pkg-config \
            mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets

      # --no-fail-fast so one broken crate does not hide the state of the other five.
      - run: cargo test --workspace --no-fail-fast

  smoke:
    name: README commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system headers and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libasound2-dev pkg-config \
            mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2

      # Every command below appears in README.md or in `--help`. A documented command that
      # does not run is a lie the reader discovers on their own machine, which is the worst
      # place to find one.
      - name: The licence copies match the workspace root
        # A crate archive that names a licence it does not contain is a packaging defect. A
        # copy that silently fell behind the root is the same defect with better intentions,
        # and it is invisible until someone opens the published tarball.
        run: |
          for d in crates/* apps/*; do
            cmp LICENSE-MIT "$d/LICENSE-MIT" || { echo "$d/LICENSE-MIT differs"; exit 1; }
            cmp LICENSE-APACHE "$d/LICENSE-APACHE" || { echo "$d/LICENSE-APACHE differs"; exit 1; }
          done
          echo "licence copies match"

      - name: Validate the demo story
        run: cargo run -q -p rustory-vn -- check stories/demo.ron

      # A config is opaque to the core, so before this a typo in one stayed invisible until
      # playback reached that node. The fixture is written inline because a broken story is not
      # something the repository should carry around and someone might fix.
      - name: A rejected gameplay config fails the check
        run: |
          cat > /tmp/bad-config.ron <<'RON'
          Story(
              meta: (title: Some("bad config"), author: None),
              start: "start",
              nodes: {
                  "start": (
                      beats: [],
                      exit: Gameplay(spec: (
                          system: "timer.timed_choice",
                          config: Some((
                              prompt: Some("Pick"),
                              duration_ms: 3000,
                              options: [],
                              correct: 9,
                          )),
                          outcomes: { "correct": "start", "wrong": "start", "timeout": "start" },
                      )),
                  ),
              },
          )
          RON
          ! cargo run -q -p rustory-vn -- check /tmp/bad-config.ron
          cargo run -q -p rustory-vn -- check /tmp/bad-config.ron --json > /tmp/bad.json || true
          python3 -c "import json;r=json.load(open('/tmp/bad.json'));assert not r['ok'] and r['bad_configs'], r"

      # The translated story is the only place the locale tables are exercised end to end.
      # Checking completeness alone would pass a file whose keys resolve to nothing.
      - name: Validate the translated story, and that each language is complete
        run: |
          cargo run -q -p rustory-vn -- check stories/localised.ron | tee /tmp/localised.txt
          grep -q "3 language(s)" /tmp/localised.txt
          test "$(grep -c 'complete' /tmp/localised.txt)" -eq 3

      - name: Each language produces its own lines, not English
        run: |
          cargo run -q -p rustory-vn -- transcript stories/localised.ron --language ja > /tmp/ja.txt
          cargo run -q -p rustory-vn -- transcript stories/localised.ron --language zh-Hans > /tmp/zh.txt
          cargo run -q -p rustory-vn -- transcript stories/localised.ron --language en > /tmp/en.txt
          # Three different files, and each contains a character only it should.
          grep -q "最終電車" /tmp/ja.txt
          grep -q "末班车" /tmp/zh.txt
          grep -q "last train" /tmp/en.txt
          ! grep -q "last train" /tmp/ja.txt

      - name: A language the story does not have is refused
        run: |
          ! cargo run -q -p rustory-vn -- transcript stories/localised.ron --language fr

      # A missing line and a missing language are different faults, and falling back must not
      # blur them. The fixture removes one key from one language of the shipped story.
      - name: A missing line is refused, and allowed only when asked
        run: |
          python3 scripts/strip-line.py stories/localised.ron /tmp/partial.ron
          ! cargo run -q -p rustory-vn -- transcript /tmp/partial.ron --language ja
          cargo run -q -p rustory-vn -- transcript /tmp/partial.ron --language ja --allow-missing \
            | tee /tmp/partial.txt
          # The fallback is English, so the line is present and not Japanese.
          grep -q "walk home the long way" /tmp/partial.txt
          # `check` stays strict: the hole is still counted as a hole.
          cargo run -q -p rustory-vn -- check /tmp/partial.ron | grep -q "language ja: missing"

      - name: The check report parses as JSON
        run: |
          cargo run -q -p rustory-vn -- check stories/demo.ron --json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] and r['nodes'] > 0, r"

      - name: The operation catalogue is self-describing
        run: |
          cargo run -q -p rustory-vn -- ops --json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['count'] == len(r['operations']); assert all(o['example'] for o in r['operations']), r"

      - name: A documented operation applies
        run: |
          cargo run -q -p rustory-vn -- edit stories/demo.ron \
            --op '{"op":"SetTitle","title":"Checked"}' --dry-run

      # The catalogue promises a caller can copy an example and change its values. One example
      # being checked proves nothing about the other sixteen, so all of them are parsed back
      # through the CLI. A refusal about the *story* (deleting a node the demo does not have)
      # still proves the example parsed; `invalid_operation` is the failure that matters.
      - name: Every catalogue example parses as an operation
        run: |
          cargo build -q -p rustory-vn
          python3 - <<'PY'
          import json, subprocess, sys

          exe = "target/debug/rustory"
          catalogue = json.loads(subprocess.check_output([exe, "ops", "--json"]))
          broken = []
          for op in catalogue["operations"]:
              result = subprocess.run(
                  [exe, "edit", "stories/demo.ron", "--op", op["example"], "--dry-run", "--json"],
                  capture_output=True, text=True)
              body = json.loads(result.stdout) if result.stdout.strip() else {}
              if not body:
                  broken.append((op["name"], f"no JSON on stdout (exit {result.returncode})"))
              elif body.get("code") == "invalid_operation":
                  broken.append((op["name"], body.get("message", "")))

          for name, message in broken:
              print(f"{name}: {message}")
          if broken:
              sys.exit(1)
          print(f"{len(catalogue['operations'])} examples parsed")
          PY

      - name: Generate the placeholder art and sound
        run: cargo run -q -p rustory-vn -- gen-assets assets

      # Two things at once: the generated WAV is a real container, and the bank indexes it.
      # A silent engine would still pass the rest of this workflow, so the audio path needs
      # a check of its own.
      - name: The generated sound is a valid WAV and is indexed
        run: |
          cargo run -q -p rustory-vn -- probe | tee /tmp/probe.txt
          grep -q "audio files: 3" /tmp/probe.txt
          python3 - <<'PY'
          import struct
          data = open('assets/audio/classroom.wav', 'rb').read()
          assert data[:4] == b'RIFF' and data[8:12] == b'WAVE', 'not a WAV'
          rate, = struct.unpack('<I', data[24:28])
          assert rate == 22050, rate
          seconds = (len(data) - 44) / (rate * 2)
          assert 3.9 < seconds < 4.1, seconds
          print(f'{len(data)} bytes, {seconds:.1f}s at {rate} Hz')
          PY

      - name: Render a frame by position
        run: cargo run -q -p rustory-vn -- shot stories/demo.ron --at honest:2 --out /tmp/frame.png

      # A gameplay system draws its own screen now, which means the handover is no longer a
      # block of text in the dialogue box. Both shipped systems are rendered and told apart:
      # identical bytes would mean the view never reached the frame.
      - name: Render the two gameplay screens
        run: |
          cargo run -q -p rustory-vn -- shot stories/demo.ron --at honest:exit --out /tmp/timer.png \
            | tee /tmp/timer.txt
          cargo run -q -p rustory-vn -- shot stories/demo.ron --at confession:exit --out /tmp/quiz.png \
            | tee /tmp/quiz.txt
          grep -q "gameplay: timer.timed_choice" /tmp/timer.txt
          grep -q "gameplay: quiz.multi_round" /tmp/quiz.txt
          ! cmp -s /tmp/timer.png /tmp/quiz.png

      - name: Render a frame in a chosen language
        run: |
          cargo run -q -p rustory-vn -- shot stories/localised.ron --language ja --out /tmp/ja.png
          cargo run -q -p rustory-vn -- shot stories/localised.ron --language en --out /tmp/en.png
          # The frames must differ: identical bytes would mean the language was ignored.
          ! cmp -s /tmp/ja.png /tmp/en.png

      - name: Play the story headlessly
        run: cargo run -q -p rustory-vn -- transcript stories/demo.ron

      # The wasm tier, end to end against a real module rather than a fixture: build the
      # example guest, install it where the convention says, and play the story that names it.
      # This is also the regression test for the fuel budget — 4 096 was too small for a Rust
      # guest's first call, and only a real guest says so.
      - name: A WebAssembly module drives a story
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown \
            --manifest-path examples/wasm-guest/Cargo.toml
          mkdir -p plugins
          cp examples/wasm-guest/target/wasm32-unknown-unknown/release/rustory_wasm_guest_example.wasm \
            plugins/doors.wasm
          cargo run -q -p rustory-vn -- check stories/doors.ron | tee /tmp/doors.txt
          grep -q "plugin doors: plugins/doors.wasm (directory)" /tmp/doors.txt
          cargo run -q -p rustory-vn -- transcript stories/doors.ron | tee /tmp/doors-lines.txt
          # The guest reports `won` for option 2, so the story takes the branch it maps.
          grep -q "light behind it" /tmp/doors-lines.txt
          # And the view reaches the frame, rather than silently drawing nothing.
          cargo run -q -p rustory-vn -- shot stories/doors.ron --at hallway:exit --out /tmp/doors.png \
            | tee /tmp/doors-shot.txt
          grep -qv "0 primitives" /tmp/doors-shot.txt

      - name: An unloadable module fails the check
        run: |
          # Declared, missing, and therefore fatal: loading nothing would leave the story
          # unplayable with no explanation.
          cat > /tmp/needs-plugin.ron <<'RON'
          Story(
              meta: (title: Some("needs a module"), author: None),
              start: "start",
              plugins: { "nowhere": "absent.wasm" },
              nodes: {
                  "start": (
                      beats: [],
                      exit: Gameplay(spec: (
                          system: "nowhere",
                          config: None,
                          outcomes: { "done": "start" },
                      )),
                  ),
              },
          )
          RON
          ! cargo run -q -p rustory-vn -- check /tmp/needs-plugin.ron

      - name: The editor renders a frame without a window
        run: cargo run -q -p rustory-vn-editor -- --check stories/demo.ron --out /tmp/preview.png
