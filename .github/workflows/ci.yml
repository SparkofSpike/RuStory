name: CI

# What this workflow is for
#
# README claims a test count, and a claim nobody checks decays. These gates run on every
# push: the code is formatted, clippy has nothing to say, the tests pass, and every command
# the README tells a reader to try actually runs.
#
# Nothing here builds a release artifact — this is a correctness gate, not a packaging
# pipeline.
#
# Linux rather than Windows because the runner costs nothing and starts faster. The GPU
# tests skip themselves when no adapter is present, and Ubuntu's software Vulkan usually
# means they run instead; either way the logic is exercised.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning nobody fails on is a warning nobody reads. Keep this on so clippy's advice
  # cannot rot into background noise.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting is checked, never applied: CI that rewrites the tree leaves a developer
      # unsure whether the change on disk is theirs.
      - run: cargo fmt --all -- --check

  clippy-and-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # winit needs xkbcommon and wayland headers, cpal needs ALSA, and the renderer needs a
      # Vulkan driver at run time. lavapipe is the software one, so a machine with no GPU still
      # draws — which is what makes the frame checks below meaningful on a runner.
      - name: Install system headers and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libasound2-dev pkg-config \
            mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets

      # --no-fail-fast so one broken crate does not hide the state of the other five.
      - run: cargo test --workspace --no-fail-fast

  smoke:
    name: README commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system headers and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libasound2-dev pkg-config \
            mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2

      # Every command below appears in README.md or in `--help`. A documented command that
      # does not run is a lie the reader discovers on their own machine, which is the worst
      # place to find one.
      - name: Validate the demo story
        run: cargo run -q -p rustory-vn -- check stories/demo.ron

      - name: The check report parses as JSON
        run: |
          cargo run -q -p rustory-vn -- check stories/demo.ron --json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] and r['nodes'] > 0, r"

      - name: The operation catalogue is self-describing
        run: |
          cargo run -q -p rustory-vn -- ops --json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['count'] == len(r['operations']); assert all(o['example'] for o in r['operations']), r"

      - name: A documented operation applies
        run: |
          cargo run -q -p rustory-vn -- edit stories/demo.ron \
            --op '{"op":"SetTitle","title":"Checked"}' --dry-run

      # The catalogue promises a caller can copy an example and change its values. One example
      # being checked proves nothing about the other sixteen, so all of them are parsed back
      # through the CLI. A refusal about the *story* (deleting a node the demo does not have)
      # still proves the example parsed; `invalid_operation` is the failure that matters.
      - name: Every catalogue example parses as an operation
        run: |
          cargo build -q -p rustory-vn
          python3 - <<'PY'
          import json, subprocess, sys

          exe = "target/debug/rustory"
          catalogue = json.loads(subprocess.check_output([exe, "ops", "--json"]))
          broken = []
          for op in catalogue["operations"]:
              result = subprocess.run(
                  [exe, "edit", "stories/demo.ron", "--op", op["example"], "--dry-run", "--json"],
                  capture_output=True, text=True)
              body = json.loads(result.stdout) if result.stdout.strip() else {}
              if not body:
                  broken.append((op["name"], f"no JSON on stdout (exit {result.returncode})"))
              elif body.get("code") == "invalid_operation":
                  broken.append((op["name"], body.get("message", "")))

          for name, message in broken:
              print(f"{name}: {message}")
          if broken:
              sys.exit(1)
          print(f"{len(catalogue['operations'])} examples parsed")
          PY

      - name: Generate the placeholder art and sound
        run: cargo run -q -p rustory-vn -- gen-assets assets

      # Two things at once: the generated WAV is a real container, and the bank indexes it.
      # A silent engine would still pass the rest of this workflow, so the audio path needs
      # a check of its own.
      - name: The generated sound is a valid WAV and is indexed
        run: |
          cargo run -q -p rustory-vn -- probe | tee /tmp/probe.txt
          grep -q "audio files: 3" /tmp/probe.txt
          python3 - <<'PY'
          import struct
          data = open('assets/audio/classroom.wav', 'rb').read()
          assert data[:4] == b'RIFF' and data[8:12] == b'WAVE', 'not a WAV'
          rate, = struct.unpack('<I', data[24:28])
          assert rate == 22050, rate
          seconds = (len(data) - 44) / (rate * 2)
          assert 3.9 < seconds < 4.1, seconds
          print(f'{len(data)} bytes, {seconds:.1f}s at {rate} Hz')
          PY

      - name: Render a frame by position
        run: cargo run -q -p rustory-vn -- shot stories/demo.ron --at honest:2 --out /tmp/frame.png

      - name: Play the story headlessly
        run: cargo run -q -p rustory-vn -- transcript stories/demo.ron

      - name: The editor renders a frame without a window
        run: cargo run -q -p rustory-vn-editor -- --check stories/demo.ron --out /tmp/preview.png
